<footer class="site-footer">

  <span>
    &copy;
    {{ 'now' | date: "%Y" }}
    {{ site.data.profile.name }}
  </span>

  <span>

    {% if site.data.profile.email != "" %}
      <a href="mailto:{{ site.data.profile.email }}">
        mail
      </a>
    {% endif %}

    {% if site.data.profile.linkedin != "" %}
      ·
      <a href="{{ site.data.profile.linkedin }}">
        linkedin
      </a>
    {% endif %}

    {% if site.data.profile.github != "" %}
      ·
      <a href="{{ site.data.profile.github }}">
        github
      </a>
    {% endif %}

  </span>

</footer>
