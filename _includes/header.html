<header class="site-header">
  <nav>
    <a href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
    <a href="{{ '/about/' | relative_url }}">about</a>
  </nav>

  <div class="header-actions">
    {% unless page.url contains '/about' %}
    <a href="{{ '/assets/cv.pdf' | relative_url }}"
       class="download-btn"
       id="download-cv"
       download="Matteo-Cavalli-CV.pdf">↓ pdf</a>
    {% endunless %}

    <button id="theme-toggle"
            class="theme-toggle"
            aria-label="Change theme">dark</button>
  </div>
</header>
