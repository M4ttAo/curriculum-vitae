<header class="site-header">

  <nav>
    <a
      class="site-name"
      href="{{ '/' | relative_url }}"
    >
      {{ site.data.profile.name }}
    </a>

    <a href="{{ '/about/' | relative_url }}">
      about
    </a>
  </nav>

  <div class="header-actions">

    {% unless page.url contains '/about' %}
      <a
        href="{{ '/assets/cv.pdf' | relative_url }}"
        class="download-btn"
        download="Matteo-Cavalli-CV.pdf"
      >
        ↓ pdf
      </a>
    {% endunless %}

    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="Toggle theme"
    >
      dark
    </button>

  </div>

</header>
