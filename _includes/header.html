<header class="site-header">
  <nav>
    <a href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
    <a href="{{ '/blog/' | relative_url }}">blog</a>
    <a href="{{ '/about/' | relative_url }}">about</a>
  </nav>

  <div class="header-actions">
    {% unless page.url contains '/blog' or page.url contains '/about' %}
    <a href="{{ '/assets/cv.pdf' | relative_url }}"
       class="download-btn"
       id="download-cv"
       download="Matteo-Cavalli-CV.pdf">↓ pdf</a>
    {% endunless %}

    <button id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Use dark theme"
            title="Use dark theme">
      <span class="theme-toggle-track" aria-hidden="true">
        <span class="theme-toggle-icon theme-toggle-sun">
          <svg viewBox="0 0 24 24" focusable="false">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
          </svg>
        </span>
        <span class="theme-toggle-icon theme-toggle-moon">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5a8.5 8.5 0 1 0 12 12Z"></path>
          </svg>
        </span>
        <span class="theme-toggle-thumb"></span>
      </span>
    </button>
  </div>
</header>
